<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Booking</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app">
        <h1 class="heading">Lesson Booking</h1>
        <main>

            <div v-if="displayCart" class="cart-section">
                <button class="checkout-button" @click="toggleCart">Return to Lessons</button>
                <h2 class="cart-heading">Shopping Cart</h2>
                <p>First Name: <input type="text" v-model="order.name"></p>
                <p>Telephone: <input type="text" v-model="order.telephone"></p>
                <ul>
                    <li v-for="item in displayLessons()">
                        <p>
                            {{ item.lesson.Subject }} - ({{ item.count }})
                            <button class="remove-button" @click="removeFromCart(item.lesson)">
                                Remove
                            </button>
                        </p>
                    </li>
                </ul>
                <button class="checkout-button" @click="alertCheckout()"
                    :disabled="!EnterRequiredDetails">Checkout</button>
            </div>

            <div v-else>

                <button class="checkout-button" @click="toggleCart" :disabled="!canShowCart">Checkout ({{ numberOfItems
                    }})</button>
                <button class="sorting-button" @click="toggleSort">
                    Sort by Price: {{ sortbyPrice ? 'Low - High' : 'High - Low' }}
                </button>

                <p>Sort by Price:</p>
                <select v-model="sortType">
                    <option disabled value="unknown">Choose</option>
                    <option value="Price">Price</option>
                    <option value="Availability">Availability</option>
                    <option value="Location">Location</option>
                    <option value="Subject">Subject</option>
                </select>
                <div v-for="lesson in sortedLessons" class="lesson-card">

                    <div class="lessons-container">
                        <img class="lesson-image" v-bind:src="imageAddress(lesson)" :alt="lesson.ImageAlt">

                        <div class="lesson-details">

                            <h2 class="lesson-subject">{{ lesson.Subject }}</h2>
                            <div class="lesson-info">
                                <p>Lesson ID:{{ lesson.Id }}</p>
                                <p>Location:{{ lesson.Location }}</p>
                                <p>Price: £{{ lesson.Price }}</p>
                                <p>Availability:{{ lesson.Availability }}</p>
                            </div>
                            <button class="add-button" v-on:click="addToCart(lesson)"
                                :disabled="!canAddToCart(lesson)">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        const URL = "http://localhost:3000";
        const { createApp } = Vue;
        const app = createApp({
            data() {
                return {
                    lessons: [],
                    cart: [],
                    displayCart: false,
                    order: {
                        name: '',
                        telephone: ''
                    },
                    sortbyPrice: true,
                    sortType: 'unknown',

                };
            },
            created() {
                this.fetchData();
            },
            methods: {
                addToCart(lesson) {
                    this.cart.push(lesson);
                    lesson.Availability -= 1;
                },
                canAddToCart(lesson) {
                    return lesson.Availability > 0;
                },
                toggleCart() {
                    this.displayCart = !this.displayCart;

                },

                async alertCheckout() { // Prepare the order information 
                    const orderData = {
                        name: this.order.name,
                        phone: this.order.telephone, // Get the lessons and their quantities from the cart 
                        lessons: Object.values(this.displayLessons()).map(item => ({
                            id: item.lesson.Id,
                            title: item.lesson.Subject,
                            price: item.lesson.Price,
                            quantity: item.count
                        }))
                    };
                    try {
                        // Send the order to the backend 
                        const response = await fetch(URL + "/orders",
                            {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(orderData)
                            });
                        const result = await response.json();
                        if (response.ok) {
                            const contents = Object.values(this.displayLessons());

                            for (const item of contents) {
                                await this.updateLessons(item.lesson);
                            }
                            alert("Thank you for your order, " + this.order.name + ". We will contact you on " + this.order.telephone);
                            // Restore lesson availability 
                            this.cart.forEach(lesson => { lesson.Availability += 1; });
                            // Empty the cart after successful checkout 
                            this.cart = []; // Clear the customer details 
                            this.order.name = "";
                            this.order.telephone = "";
                        } else {
                            console.error("Order failed:", result);
                        }
                    }
                    catch (error) {
                        console.error("Error sending order:", error);
                    }
                },

                async updateLessons(lesson) {
                    let updateBody = {
                        Availability: lesson.Availability
                    };

                    const url = "http://localhost:3000/lessons/" + lesson._id;
                    const options = {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(updateBody)
                    }
                    let response = await (fetch (url, options));
                },
                displayLessons() {
                    const lessonCounts = {};
                    for (let i = 0; i < this.cart.length; i++) {
                        if (lessonCounts[this.cart[i].Id]) {
                            lessonCounts[this.cart[i].Id].count += 1;
                        } else {
                            lessonCounts[this.cart[i].Id] = {
                                lesson: this.cart[i],
                                count: 1
                            };
                        }
                    }
                    return lessonCounts;
                },

                removeFromCart(lesson) {
                    const index = this.cart.indexOf(lesson);
                    if (index > -1) {
                        this.cart.splice(index, 1);
                        lesson.Availability += 1;
                    }
                },

                async fetchData() {
                    const url = URL + "/lessons";
                    let response = await (fetch(url));
                    this.lessons = await response.json();
                },
                toggleSort() {
                    this.sortbyPrice = !this.sortbyPrice;
                },
                imageAddress(lesson) {
                    return URL + "/images/" + lesson.Image;
                }
            },
            computed: {
                numberOfItems: function () {
                    return this.cart.length;
                },
                EnterRequiredDetails: function () {
                    return this.order.name != "" && this.order.telephone != "";
                },
                canShowCart: function () {
                    return this.cart.length > 0;
                },
                sortedLessons: function () {
                    const lessons = [...this.lessons];
                    if (this.sortType === 'unknown') {
                        return lessons;
                    }
                    return lessons.sort((a, b) => {
                        let result;
                        if (this.sortType === 'Price' || this.sortType === 'Availability') {
                            result = Number(a[this.sortType]) - Number(b[this.sortType]);
                        }
                        else {
                            result = String(a[this.sortType] ?? '').localeCompare(String(b[this.sortType] ?? ''));
                        }
                        return this.sortbyPrice ? result : -result;
                    });
                }

            }

        });
        app.mount('#app');
    </script>

</body>

</html>
