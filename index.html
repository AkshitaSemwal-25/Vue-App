<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson Booking</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <div id="app">


        <h1 class="heading">Lesson Booking</h1>


        <button class="checkout-button" @click="toggleCart">Checkout ({{ numberOfItems }})</button>

        <main>

            <div v-if="displayCart" class="cart-section">
                <h2 class="cart-heading">Shopping Cart</h2>
                <p>First Name: <input type="text" v-model="order.name"></p>
                <p>Telephone: <input type="text" v-model="order.telephone"></p>
                <button class="checkout-button" :disabled="!EnterRequiredDetails"
                    @click="alertCheckout()">Checkout</button>
            </div>

            <div v-else class="lessons-container">

                <div v-for="lesson in lessons" class="lesson-card">

                    <img class="lesson-image" v-bind:src="lesson.Image" :alt="lesson.ImageAlt">

                    <div class="lesson-details">

                        <h2 class="lesson-subject">{{ lesson.Subject }}</h2>
                        <div class="lesson-info">
                            <p>Lesson ID:{{ lesson.Id }}</p>
                            <p>Location:{{ lesson.Location }}</p>
                            <p>Price:{{ lesson.Price }}</p>
                            <p>Availability:{{ lesson.Availability }}</p>
                        </div>
                        <button class="add-button" v-on:click="addToCart(lesson)" :disabled="!canAddToCart(lesson)">Add
                            to Cart</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        const { createApp } = Vue;
        const app = createApp({
            data() {
                return {
                    lessons: [],
                    cart: [],
                    displayCart: false,
                    order: {
                        name: '',
                        telephone: ''
                    }

                };
            },
            created() {
                this.fetchData();
            },
            methods: {
                addToCart(lesson) {
                    this.cart.push(lesson.Id);
                    lesson.Availability -= 1;
                },
                canAddToCart(lesson) {
                    return lesson.Availability > 0;
                },
                toggleCart() {
                    this.displayCart = !this.displayCart;

                },
                alertCheckout() {
                    alert("Order placed successfully! Thank you for your purchase.");
                    this.cart = [];
                },

                async fetchData() {
                    const url = "http://localhost:3000/";
                    let response = await (fetch(url));
                    this.lessons = await response.json();
                },

            },
            computed: {
                numberOfItems: function () {
                    return this.cart.length;
                },
                EnterRequiredDetails() {
                    return this.order.name != "" && this.order.telephone != "";
                },
                canShowCart() {
                    return this.cart.length > 0;
                }
            }
        }
        );
        app.mount('#app');
    </script>

</body>

</html>
